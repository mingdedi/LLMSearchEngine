<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMSearchEngine — 生成式搜索引擎</title>
  <meta name="description" content="描述你想要的页面，AI 为你实时生成">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 顶部栏（模型切换 + 设置按钮） ===== -->
  <div class="top-bar">
    <div class="model-switcher">
      <button id="model-switch-btn" class="model-switch-btn" title="切换模型">
        <span class="model-dot"></span>
        <span id="current-model-name">未配置</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div id="model-dropdown" class="model-dropdown hidden"></div>
    </div>
    <button id="settings-btn" class="settings-btn" title="API 配置" aria-label="打开设置">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- ===== 主内容区（搜索页） ===== -->
  <main class="main-content">

    <!-- 搜索区 -->
    <section id="search-section" class="search-section">
      <h1 class="logo">🔍 LLMSearchEngine</h1>
      <p class="tagline" id="tagline">描述你想要的页面，AI 为你实时生成</p>
      <form class="search-bar" id="search-form" autocomplete="off">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="试试：一个贪吃蛇游戏"
          aria-label="页面描述"
        >
        <button type="submit" id="generate-btn" class="generate-btn"><span class="btn-text">搜索</span></button>
      </form>
    </section>

    <!-- 进度区（初始隐藏） -->
    <section id="progress-section" class="progress-section hidden">
      <div class="progress-bar-track">
        <div id="progress-bar" class="progress-bar-fill" style="width: 0%"></div>
      </div>
      <p id="progress-text" class="progress-text">准备生成...</p>
    </section>

    <!-- 错误提示区（初始隐藏） -->
    <section id="error-section" class="error-section hidden">
      <p id="error-text" class="error-text"></p>
      <button id="retry-btn" class="retry-btn">重试</button>
    </section>

    <!-- 创意推荐区 -->
    <section id="recommend-section" class="recommend-section">
      <h2 class="recommend-title">✨ 创意推荐</h2>
      <p class="recommend-subtitle">点击卡片，直接体验 AI 生成的创意网页</p>
      <div id="recommend-grid" class="recommend-grid"></div>
    </section>

  </main>

  <!-- ===== 全屏结果区（初始隐藏） ===== -->
  <section id="result-section" class="result-section hidden">

    <!-- 顶部工具栏 -->
    <div class="result-toolbar">
      <button id="back-btn" class="back-btn" title="返回首页">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>返回</span>
      </button>

      <form id="correction-form" class="correction-bar" autocomplete="off">
        <input
          type="text"
          id="correction-input"
          class="correction-input"
          placeholder="描述需要修正的内容，如：按钮颜色改为红色"
          aria-label="修正描述"
        >
        <button type="submit" id="correction-btn" class="correction-btn"><span class="btn-text">修正</span></button>
      </form>

      <button id="open-new-tab-btn" class="icon-btn" title="在新标签页打开">↗</button>
      <button id="download-btn" class="icon-btn" title="下载到本地">⬇</button>
      <button id="force-correct-btn" class="force-correct-btn" title="强制修正">强制修正</button>
    </div>

    <!-- 修正进度条（初始隐藏） -->
    <div id="correction-progress" class="correction-progress hidden">
      <div id="correction-progress-bar" class="correction-progress-bar" style="width: 0%"></div>
    </div>

    <!-- iframe 渲染区 -->
    <iframe
      id="result-frame"
      class="result-frame"
      sandbox="allow-scripts allow-forms allow-modals"
      srcdoc=""
      title="生成的页面"
    ></iframe>

  </section>

  <!-- ===== 设置面板（模态框，初始隐藏） ===== -->
  <div id="settings-modal" class="modal-overlay modal-hidden">
    <div class="modal-content">

      <div class="modal-header">
        <h2>⚙ API 配置</h2>
        <button id="config-close" class="modal-close" title="关闭" aria-label="关闭">×</button>
      </div>

      <div class="modal-body">

        <!-- 配置选择器 -->
        <div class="config-selector-row">
          <select id="config-select" class="config-select"></select>
          <button id="config-new" class="btn-icon-sm" title="新建配置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <button id="config-delete" class="btn-icon-sm btn-icon-danger" title="删除配置" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>

        <div class="form-group">
          <label for="config-name">配置名称</label>
          <input type="text" id="config-name" placeholder="如：我的 OpenAI" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="config-api-key">API Key</label>
          <input type="password" id="config-api-key" placeholder="sk-xxxxxxxxxxxxx" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="config-base-url">Base URL</label>
          <input type="text" id="config-base-url" placeholder="https://api.openai.com/v1">
        </div>

        <div class="form-group">
          <label for="config-model">Model</label>
          <input type="text" id="config-model" placeholder="gpt-4o">
        </div>

        <div class="form-group">
          <label for="config-temperature">Temperature <span id="temp-value-display" style="font-weight:400;color:var(--accent)">0.7</span></label>
          <div class="temp-slider-row">
            <span class="temp-label">0</span>
            <input type="range" id="config-temperature" min="0" max="2" step="0.01" value="0.7">
            <span class="temp-label">2</span>
          </div>
        </div>

        <div class="form-group">
          <label for="config-extra-body">Extra Body <span style="font-weight:400;color:var(--text-secondary)">— JSON，将合并到请求体中</span></label>
          <textarea id="config-extra-body" placeholder='{"enable_thinking": true}' rows="3" autocomplete="off"></textarea>
        </div>

        <div class="presets">
          <span class="presets-label">快捷预设：</span>
          <button class="preset-btn" data-name="OpenAI" data-base-url="https://api.openai.com/v1" data-model="gpt-4o">OpenAI</button>
          <button class="preset-btn" data-name="DeepSeek" data-base-url="https://api.deepseek.com/v1" data-model="deepseek-chat">DeepSeek</button>
          <button class="preset-btn" data-name="智谱GLM" data-base-url="https://open.bigmodel.cn/api/paas/v4" data-model="glm-4">智谱</button>
        </div>

        <p class="security-note">ℹ 密钥仅存储在本地浏览器，不会上传到任何服务器</p>

      </div>

      <div class="modal-footer">
        <button id="config-cancel" class="btn-secondary">取消</button>
        <button id="config-set-active" class="btn-secondary" disabled>设为当前</button>
        <button id="config-save" class="btn-primary">保存配置</button>
      </div>

    </div>
  </div>

  <!-- ===== Toast 通知 ===== -->
  <div id="toast" class="toast hidden"></div>

  <noscript>
    <p style="text-align: center; margin-top: 40px; color: #ccc;">
      本应用需要 JavaScript 支持，请启用后刷新。
    </p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
